
name: Update MTG Booster Rankings

on:
  schedule:
    - cron: "37 3 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mtg-boosters
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out repo
        uses: actions/checkout@v4
        with:
          persist-credentials: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Test calculations and formatting
        run: python -m unittest discover -s tests -v

      - name: Build and update Discord rankings
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
        run: python tracker.py --top 15

      - name: Save Discord message IDs and price history
        if: always()
        run: |
          if [[ -n "$(git status --porcelain -- state/message_ids.json state/price_history.json)" ]]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add state/message_ids.json state/price_history.json
            git commit -m "Save Discord IDs and market history [skip ci]"
            git push
          fi
